# Conda environment for syntheseus_benchmark analysis and CLI tools.
# Environment variables are used for path overrides in src/config.py.
# Example: export SYNTHSEUS_BENCHMARK_METHOD_RESULTS_DIR=/path/to/results

name: syntheseus_benchmark
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - rdkit
  - pandas
  - tqdm
  - requests
  - beautifulsoup4
  - cirpy
  - pubchempy
  - numpy
